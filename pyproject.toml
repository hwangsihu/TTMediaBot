[project]
name = "TTMediaBot"
version = "1.0.0"
description = "A bot for music streaming to TeamTalk Servers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "babel",
    "beautifulsoup4",
    "mpv",
    "patool",
    "portalocker",
    "pydantic",
    "pyshorteners",
    "requests",
    "vk-api",
    "yandex-music",
    "yt-dlp",
]

[dependency-groups]
dev = ["ruff", "vermin"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"
respect-gitignore = true
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".venv",
    "env",
    "TeamTalkPy",
    "mpv.py",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1", # Docstrings
    # Various incompatible stuff
    "COM812",
    "D203",
    "D211",
    "D213",
    "FBT",     # Ignore boolean trap for now, too hard to fix
    "LOG015",  # We use many of them, too difficult to fix now
    "PLR0913", # We need functions with many arguments
    "G004",    # Why not?
    "E501",    # It's cool for formatting, but bothers when refactoring
    "TRY300",
]

[tool.ruff.lint.mccabe]
max-complexity = 15 # For now. Too difficult to refactor

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
preview = true
